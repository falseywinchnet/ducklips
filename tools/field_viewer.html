<div id="ducklips-full-enhanced">
  <h3>Full enhanced speech field</h3>
  <div class="viz-controls">
    <label class="form-label">Recording<select class="form-select" data-recording></select></label>
    <label class="form-label">Frequency row height<select class="form-select" data-row-height><option value="1" selected>1 screen pixel</option><option value="2">2 screen pixels</option><option value="4">4 screen pixels</option></select></label>
  </div>
  <div class="text-small" data-status aria-live="polite"></div>
  <div class="enhanced-extent"><canvas data-field role="img" aria-label="Complete enhanced field, original magma colors, every computed row and time column"></canvas><svg role="img" aria-label="Full source time and frequency axes"></svg></div>
  <div class="viz-row text-small"><span data-floor></span><img data-legend alt="Original magma intensity scale" width="160" height="12"><span>0 dB</span><span>re original display reference</span></div>
  <div class="text-small">Human: <a href="https://commons.wikimedia.org/wiki/File:NATO_Phonetic_Alphabet_reading.ogg">valeatory · NATO alphabet recording</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a> · transformed analysis</div>
</div>
<style>
#ducklips-full-enhanced .enhanced-extent { position:relative; margin-top:8px; }
#ducklips-full-enhanced [data-field] { position:absolute; left:64px; top:12px; image-rendering:pixelated; }
#ducklips-full-enhanced svg { position:absolute; inset:0; overflow:visible; pointer-events:none; }
#ducklips-full-enhanced svg text { fill:var(--foreground); font-size:12px; }
#ducklips-full-enhanced svg .domain, #ducklips-full-enhanced svg .tick line { stroke:var(--border); }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script type="application/json" id="ducklips-full-enhanced-data">__FIELD_DATA__</script>
<script>
(() => {
  const root=document.getElementById('ducklips-full-enhanced');
  const data=JSON.parse(document.getElementById('ducklips-full-enhanced-data').textContent);
  const select=root.querySelector('[data-recording]'), scale=root.querySelector('[data-row-height]');
  data.records.forEach((record,index)=>{select.add(new Option(record.label,String(index)));});
  select.value=String(data.records.length-1);
  const canvas=root.querySelector('[data-field]'), extent=root.querySelector('.enhanced-extent');
  const images=data.records.map(record=>{const image=new Image();image.onload=draw;image.src=record.png;return image;});
  root.querySelector('[data-legend]').src=data.legend;
  function restore(saved){
    const state=saved?.privateContent;
    if(state && Number.isInteger(+state.recording) && +state.recording>=0 && +state.recording<data.records.length)select.value=String(state.recording);
    if(state && ['1','2','4'].includes(String(state.rowHeight)))scale.value=String(state.rowHeight);
  }
  restore(window.openai?.widgetState);
  function draw(){
    const rec=data.records[+select.value], image=images[+select.value];
    if(!image.complete || !image.naturalWidth)return;
    const width=Math.floor(root.getBoundingClientRect().width);
    const xScale=Math.max(1,Math.floor((width-80)/rec.cols)), yScale=+scale.value;
    const plotWidth=rec.cols*xScale, plotHeight=rec.rows*yScale, height=plotHeight+60;
    const dpr=window.devicePixelRatio||1;
    extent.style.height=height+'px';
    canvas.width=Math.round(plotWidth*dpr);canvas.height=Math.round(plotHeight*dpr);
    canvas.style.width=plotWidth+'px';canvas.style.height=plotHeight+'px';
    const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
    ctx.drawImage(image,0,0,canvas.width,canvas.height);
    canvas.dataset.rows=rec.rows;canvas.dataset.columns=rec.cols;
    canvas.dataset.rowPixels=yScale;canvas.dataset.columnPixels=xScale;
    root.querySelector('[data-status]').textContent=`All ${rec.rows} rows × ${rec.cols} columns · ${yScale} px/row · ${xScale} px/column · original magma / ${rec.db_range} dB`;
    root.querySelector('[data-floor]').textContent=`−${rec.db_range} dB`;
    const svg=d3.select(root.querySelector('svg')).attr('width',Math.max(width,plotWidth+80)).attr('height',height).attr('viewBox',`0 0 ${Math.max(width,plotWidth+80)} ${height}`);
    svg.selectAll('*').remove();
    const x=d3.scaleLinear().domain(rec.time_edges).range([64,64+plotWidth]);
    const y=d3.scaleLinear().domain(rec.frequency_edges).range([12+plotHeight,12]);
    svg.append('g').attr('transform',`translate(0,${12+plotHeight})`).call(d3.axisBottom(x).ticks(width<400?3:5).tickFormat(d3.format('.2f')));
    svg.append('g').attr('transform','translate(64,0)').call(d3.axisLeft(y).ticks(8).tickFormat(d3.format('.0f')));
    svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',64+plotWidth/2).attr('y',height-4).attr('text-anchor','middle').text('Source time (s)');
    svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform',`translate(14,${12+plotHeight/2}) rotate(-90)`).attr('text-anchor','middle').text('Frequency (Hz)');
    svg.append('rect').attr('data-chart-frame','').attr('x',64).attr('y',12).attr('width',plotWidth).attr('height',plotHeight).attr('fill','none').attr('stroke','var(--border)');
  }
  for(const control of [select,scale])control.addEventListener('change',()=>{
    draw();window.openai?.setWidgetState?.({modelContent:{recording:data.records[+select.value].label,full_enhanced_field:true,row_css_pixels:+scale.value},privateContent:{recording:select.value,rowHeight:scale.value}}).catch(()=>{});
  });
  window.addEventListener('openai:set_globals',event=>{restore(event.detail?.globals?.widgetState);draw();});
  new ResizeObserver(draw).observe(root);
})();
</script>
